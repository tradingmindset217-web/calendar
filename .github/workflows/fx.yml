# Guardar en: .github/workflows/daily-report.yml
name: Reporte económico diario

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 00:00 Colombia (UTC-5)
  workflow_dispatch:       # permite ejecutarlo manualmente para probar

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar reporte
        env:
          REPORT_TZ: America/Bogota
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_calendar.py
      - name: Guardar reporte en el repositorio
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Reporte $(date -u +%F)"
          git push
