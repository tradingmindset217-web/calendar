# Guardar en: .github/workflows/fx.yml
# Las horas de GitHub están en UTC. Colombia = UTC-5, así que 19:30 Colombia = 00:30 UTC del día siguiente.
name: Sistema FX

on:
  schedule:
    - cron: "30 0 * * 1"         # DOMINGO 19:30 Colombia -> plan semanal
    - cron: "30 0 * * 2-5"       # LUNES a JUEVES 19:30 Colombia -> plan diario para mañana
    # Opcional: alertas antes de cada evento (descomenta la línea siguiente para activarlas)
    # - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "outlook (plan diario), weekly (plan semanal), briefing o alerts"
        default: "outlook"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 0 * * 1' && 'weekly' || (github.event.schedule == '*/15 * * * 1-5' && 'alerts' || 'outlook')) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ejecutar
        env:
          REPORT_TZ: America/Bogota
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # WhatsApp (opcional, no oficial). Si no creas estos secretos, simplemente no se usa.
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          MAX_SETUPS: "3"
        run: python fx_system.py "$MODE"
      - name: Guardar reporte y estado
        if: env.MODE != 'alerts'
        run: |
          git config user.name "fx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ || true
          git diff --staged --quiet || (git commit -m "Plan $(date -u +%F)" && git push)
