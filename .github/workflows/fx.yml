# Guardar en: .github/workflows/fx.yml
name: Sistema FX

on:
  schedule:
    - cron: "0 5 * * 1-5"        # 00:00 Colombia, lunes a viernes -> resumen del día
    - cron: "*/15 * * * 1-5"     # cada 15 min, lunes a viernes -> alertas
    - cron: "0 19 * * 0"         # domingo 14:00 Colombia -> plan semanal
  workflow_dispatch:
    inputs:
      mode:
        description: "briefing, alerts o weekly"
        default: "briefing"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '*/15 * * * 1-5' && 'alerts' || (github.event.schedule == '0 19 * * 0' && 'weekly' || 'briefing')) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ejecutar
        env:
          REPORT_TZ: America/Bogota
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOCUS_PAIRS: GBPAUD
        run: python fx_system.py "$MODE"
      - name: Guardar reporte
        if: env.MODE != 'alerts'
        run: |
          git config user.name "fx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ || true
          git diff --staged --quiet || (git commit -m "Reporte $(date -u +%F)" && git push)
